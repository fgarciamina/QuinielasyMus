function loadXMLDoc(url,cfunc)
{
	if (window.XMLHttpRequest)
 	 {// code for IE7+, Firefox, Chrome, Opera, Safari
 		 xmlhttp=new XMLHttpRequest();
  	}
	else
  	{// code for IE6, IE5
  		xmlhttp=new ActiveXObject("Microsoft.XMLHTTP");
 	 }
	xmlhttp.onreadystatechange=cfunc;
	xmlhttp.open("GET",url,true);
	xmlhttp.send();
}

function CambiaPagina(str)
{
	var a = window.location.toString();
	a = a.substring(a.indexOf("=")+1);
	
	location.href = str+".htm?pronosticante="+a;
}

function PonTablaTodos(str)
{
	var a = window.location.toString();
	a = a.substring(a.indexOf("=")+1);
	
	if(str=="JornadaEnCurso")
		var jornada=0;
	else
	{
		var jornada=document.getElementById("LaJornadaT").selectedIndex;
		jornada++;
	}

	loadXMLDoc("PonerTablaTodosYEscrutinio.php?p="+a+"&q="+jornada+"&r=todos&randNum="+new Date().getTime(),function()
  	{
  		if (xmlhttp.readyState==4 && xmlhttp.status==200)
		{
			var response = xmlhttp.responseText;
			var update = new Array();
			if(response.indexOf('|$|'!= -1))
			{
				update = response.split('|$|');
				document.getElementById('LaJornadaT').selectedIndex=update[0];
				document.getElementById("TablaTodos").innerHTML=update[1];
			}
		}
  	});
}
</script>
