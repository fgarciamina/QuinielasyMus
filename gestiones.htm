<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>
SICREL
</title>
<link rel="stylesheet" href="./estilosgrande.css">
<link rel="stylesheet" media="screen and (max-width:750px)" href="./estilospeque.css">
<link rel="shortcut icon" href="./mrcaudio.ico">
<script type="text/javascript">
function loadXMLDoc(url,cfunc)
{
	if (window.XMLHttpRequest)
 	 {// code for IE7+, Firefox, Chrome, Opera, Safari
 		 xmlhttp=new XMLHttpRequest();
  	}
	else
  	{// code for IE6, IE5
  		xmlhttp=new ActiveXObject("Microsoft.XMLHTTP");
 	}
	xmlhttp.onreadystatechange=cfunc;
	xmlhttp.open("GET",url,true);
	xmlhttp.send();
}

function PonMenuHTM(opcion)
{
	loadXMLDoc("PonMenu.php?p="+opcion+"&q="+new Date().getTime(),function()
	{
		if (xmlhttp.readyState==4 && xmlhttp.status==200)
		{
			var response=xmlhttp.responseText;
			var menusplit=response.split("~");
			document.getElementById("Menu").innerHTML=menusplit[0];
			document.getElementById("MenuPequeno").innerHTML=menusplit[1];
		}
	});	
}
</script>
</head>
<body onload="PonMenuHTM(0)">
	<div class="Cabecera">
		<img class="LogoMRC" src="./logoMRC.jpg" alt="MRC AUDIO"></img>
		<canvas class="CanvasBarra"></canvas>
		<h2 class="Lema">DIGITAL SOUND LEVEL CONTROLLER</h2>
	</div>
	<div class="DivDeMenuPequeno" id="MenuPequeno" style="top:65px">
	</div>
	<div class="DivDeMenu" id="Menu" style="top:11%">
	</div>
	<div class="DivDeChichaPequena" id="chichapequena" style="width:100%">
	</div>
	<div class="DivDeChicha" id="chicha" style="width:100%">
	</div>
</body>
</html>
